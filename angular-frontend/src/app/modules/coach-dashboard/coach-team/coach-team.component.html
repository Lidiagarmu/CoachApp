<div class="p-8 animate-fadeIn">
  <h2 class="text-3xl font-bold mb-6 text-gray-800 select-none"> Mi Equipo</h2>

  <!-- Loader -->
  <app-loading-spinner *ngIf="loading" text="Cargando equipo..."></app-loading-spinner>


  <!-- Equipo existente -->
  <div *ngIf="team && !loading" class="bg-white/80 p-6 rounded-2xl shadow-md border border-gray-200 space-y-6">
      <!-- Header equipo -->
      <div class="flex items-center gap-4">
      
            <!-- Contenedor del escudo -->
            <div class="relative w-24 h-24 rounded-full border shadow bg-white flex items-center justify-center overflow-hidden">
              <img
                [src]="team.shield || '/images/default-shield.jpg'"
                alt="Escudo del equipo"
                class="absolute inset-0 w-full h-full object-contain p-2 select-none"
              />
            </div>

            <!--Team name + num of players-->
            <div>
              <h3 class="text-2xl font-semibold select-none">{{ team.name }}</h3>
              <p class="text-gray-600 select-none">{{ team.players?.length || 0 }} jugadores</p>
            </div>
      </div>

    <!-- Acciones EDITAR y BORRAR -->
    <div class="flex gap-3">
      <button (click)="editMode = !editMode"
              class="px-4 py-2 rounded-lg bg-primary text-black hover:bg-primary/80 transition select-none">
        {{ editMode ? 'Cancelar' : 'Editar equipo' }}
      </button>
      <button (click)="deleteTeam()"
              class="px-4 py-2 rounded-lg bg-red-400 text-black hover:bg-red-700 transition select-none">
        Eliminar equipo
      </button>
    </div>

<!-- Modal backdrop -->
<div *ngIf="editMode"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">

  <!-- Modal container -->
  <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 space-y-4 relative">

    <!-- Título -->
    <h4 class="text-lg font-semibold select-none">
      Editar información
    </h4>

    <!-- Nombre -->
    <div>
      <label class="block text-gray-700 mb-1 select-none">Nombre</label>
      <input
        [(ngModel)]="team.name"
        class="border rounded-lg p-2 w-full focus:ring focus:ring-primary/50"
      />
    </div>

    <!-- Imagen -->
    <div>
      <label class="block text-gray-700 mb-1 select-none">
        Cambiar escudo (imagen)
      </label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="border rounded-lg p-2 w-full focus:ring focus:ring-primary/50"
      />
    </div>

    <!-- Preview -->
    <div *ngIf="previewUrl" class="relative w-24 h-24">
      <img
        [src]="previewUrl"
        class="w-full h-full object-contain rounded-lg border"
      />
      <button
        type="button"
        (click)="removeSelectedImage()"
        class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center hover:bg-red-700">
        ×
      </button>
    </div>

    <!-- Acciones -->
    <div class="flex justify-end gap-2 pt-4">
      <button
        type="button"
        (click)="editMode = false"
        class="px-4 py-2 rounded-lg border hover:bg-gray-100">
        Cancelar
      </button>

      <button
        (click)="updateTeam()"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
        Guardar cambios
      </button>
    </div>

  </div>
</div>


    <!-- Lista jugadores -->
    <div class="border-t border-gray-300 pt-4">
      <h4 class="text-lg font-semibold mb-2 select-none">Plantilla actual</h4>

      <div *ngIf="team.players?.length; else noPlayers">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let player of paginatedPlayers"
       class="group bg-white border rounded-2xl p-5 shadow-sm
              transition-all duration-300
              hover:-translate-y-1 hover:shadow-xl hover:border-primary/40">
    
    <!-- HEADER -->
    <div class="flex items-start justify-between mb-4">
      <!-- AVATAR + NAME -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-primary/20 text-black
                    flex items-center justify-center font-bold text-lg select-none">
          {{ (player.fullName || 'J')[0] }}
        </div>
        <div>
          <h3 class="font-semibold text-gray-800 leading-tight">{{ player.fullName }}</h3>
          <p class="text-sm text-gray-500">{{ player.nickname || 'Sin apodo' }}</p>
        </div>
      </div>


    </div>

    <!-- STATUS o INFO ADICIONAL -->
    <div class="flex justify-between items-center mb-5">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
        </span>
        <p class="text-sm font-medium text-green-600">Disponible</p>
      </div>
    </div>

  </div>
</div>

<div *ngIf="totalPages > 1" class="flex justify-center items-center gap-2 mt-6 select-none">
  <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="px-3 py-2 rounded-lg text-sm border
           disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100">‹</button>

  <button *ngFor="let page of visiblePages" (click)="changePage(page)" 
          class="w-9 h-9 rounded-lg text-sm font-medium transition"
          [ngClass]="currentPage === page ? 'bg-primary text-black' : 'bg-white border hover:bg-gray-100'">
    {{ page }}
  </button>

  <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" class="px-3 py-2 rounded-lg text-sm border
           disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100">›</button>
</div>


      </div>

      <ng-template #noPlayers>
        <p class="text-gray-500">Aún no hay jugadores en el equipo.</p>
      </ng-template>
    </div>
  </div>

  <!-- Crear equipo -->
  <div *ngIf="!team && !loading"
       class="bg-white/80 border border-gray-200 rounded-2xl shadow-md p-6 max-w-xl mx-auto text-center">
    <h3 class="text-xl font-semibold mb-3 text-gray-800 select-none">Crea tu equipo</h3>

    <form (ngSubmit)="createTeam()" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1 select-none">Nombre del equipo</label>
        <input [(ngModel)]="createForm.name" name="name"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none"
               placeholder="Ej. FC Academia" required />
      </div>

      <div>
        <label class="block text-gray-700 mb-1 select-none">Escudo del equipo (imagen)</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none" />
      </div>

      <button type="submit"
              class="bg-hover text-black px-5 py-2 rounded-lg hover:bg-primary/80 transition select-none">
        Crear equipo
      </button>
    </form>
  </div>

  <!-- Mensajes -->
  <p *ngIf="success" class="text-green-600 mt-4 font-medium select-none">{{ success }}</p>
  <p *ngIf="error" class="text-red-500 mt-4 font-medium select-none">{{ error }}</p>
</div>
