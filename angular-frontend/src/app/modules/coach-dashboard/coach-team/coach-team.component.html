<div class="p-8 animate-fadeIn">
  <h2 class="text-3xl font-bold mb-6 text-gray-800 select-none"> Mi Equipo</h2>

  <!-- Loader -->
  <app-loading-spinner *ngIf="loading" text="Cargando equipo..."></app-loading-spinner>


  <!-- Equipo existente -->
  <div *ngIf="team && !loading" class="bg-white/80 p-6 rounded-2xl shadow-md border border-gray-200 space-y-6">
      <!-- Header equipo -->
      <div class="flex items-center gap-4">
      
            <!-- Contenedor del escudo -->
            <div class="relative w-24 h-24 rounded-full border shadow bg-white flex items-center justify-center overflow-hidden">
              <img
                [src]="team.shield || '/images/default-shield.jpg'"
                alt="Escudo del equipo"
                class="absolute inset-0 w-full h-full object-contain p-2 select-none"
              />
            </div>

            <!--Team name + num of players-->
            <div>
              <h3 class="text-2xl font-semibold select-none">{{ team.name }}</h3>
              <p class="text-gray-600 select-none">{{ team.players?.length || 0 }} jugadores</p>
            </div>
      </div>

    <!-- Acciones -->
    <div class="flex gap-3">
      <button (click)="editMode = !editMode"
              class="px-4 py-2 rounded-lg bg-primary text-black hover:bg-primary/80 transition select-none">
        {{ editMode ? 'Cancelar' : 'Editar equipo' }}
      </button>
      <button (click)="deleteTeam()"
              class="px-4 py-2 rounded-lg bg-red-400 text-black hover:bg-red-700 transition select-none">
        Eliminar equipo
      </button>
    </div>

    <!-- Formulario edición -->
    <div *ngIf="editMode" class="border-t border-gray-300 pt-4 space-y-3">
      <h4 class="font-semibold text-lg. select-none">Editar información</h4>

      <div>
        <label class="block text-gray-700 mb-1 select-none">Nombre</label>
        <input [(ngModel)]="team.name"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none" />
      </div>

      <div>
        <label class="block text-gray-700 mb-1 select-none">Cambiar escudo (imagen)</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none" />
      </div>

      <div *ngIf="previewUrl" class="relative w-24 h-24 mt-2">
        <img [src]="previewUrl" alt="Preview imagen" class="w-full h-full object-contain rounded-lg border select-none" />
        <button type="button"
                (click)="removeSelectedImage()"
                class="absolute top-0 right-0 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-700 select-none">
          ×
        </button>
      </div>


      <button (click)="updateTeam()"
              class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition select-none">
        Guardar cambios
      </button>
    </div>

    <!-- Lista jugadores -->
    <div class="border-t border-gray-300 pt-4">
      <h4 class="text-lg font-semibold mb-2 select-none">Plantilla actual</h4>

      <div *ngIf="team.players?.length; else noPlayers">
        <table class="min-w-full border rounded-lg overflow-hidden select-none">
          <thead>
            <tr class="bg-gray-100 text-left">
              <th class="p-3 border">Nombre</th>
              <th class="p-3 border">Nickname</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let player of team.players" class="hover:bg-gray-50 transition">
              <td class="p-3 border">{{ player.fullName }}</td>
              <td class="p-3 border">{{ player.nickname }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <ng-template #noPlayers>
        <p class="text-gray-500">Aún no hay jugadores en el equipo.</p>
      </ng-template>
    </div>
  </div>

  <!-- Crear equipo -->
  <div *ngIf="!team && !loading"
       class="bg-white/80 border border-gray-200 rounded-2xl shadow-md p-6 max-w-xl mx-auto text-center">
    <h3 class="text-xl font-semibold mb-3 text-gray-800 select-none">Crea tu equipo</h3>

    <form (ngSubmit)="createTeam()" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1 select-none">Nombre del equipo</label>
        <input [(ngModel)]="createForm.name" name="name"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none"
               placeholder="Ej. FC Academia" required />
      </div>

      <div>
        <label class="block text-gray-700 mb-1 select-none">Escudo del equipo (imagen)</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="border rounded p-2 w-full focus:ring focus:ring-primary/50 select-none" />
      </div>

      <button type="submit"
              class="bg-hover text-black px-5 py-2 rounded-lg hover:bg-primary/80 transition select-none">
        Crear equipo
      </button>
    </form>
  </div>

  <!-- Mensajes -->
  <p *ngIf="success" class="text-green-600 mt-4 font-medium select-none">{{ success }}</p>
  <p *ngIf="error" class="text-red-500 mt-4 font-medium select-none">{{ error }}</p>
</div>
