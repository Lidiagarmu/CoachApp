<!-- REGISTER COMPONENT -->
<div class="min-h-screen flex items-center justify-center bg-app-gradient">
  <div class="w-full max-w-md bg-darkbg rounded-2xl shadow-lg p-8">
    <h2 class="text-3xl font-bold text-center text-primary mb-6">Registro</h2>

    <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-4">
      <!-- Nombre completo -->
      <div class="relative">
        <input
          type="text"
          formControlName="fullName"
          placeholder="Nombre completo"
          class="input-animated w-full pl-10 p-2 border border-primary rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-primary
                 text-secondary placeholder-secondary"
        />
        <svg
          class="w-5 h-5 absolute left-3 top-2.5 text-secondary fill-current"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"
          />
        </svg>
      </div>
            <!-- Nickname -->
      <div class="relative">
        <input
          type="text"
          formControlName="nickname"
          placeholder="Nickname"
          class="input-animated w-full pl-10 p-2 border border-primary rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-primary
                 text-secondary placeholder-secondary"
        />
        <svg
          class="w-5 h-5 absolute left-3 top-2.5 text-secondary fill-current"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M12 12a5 5 0 100-10 5 5 0 000 10zm-9 9v-2a7 7 0 0114 0v2H3z"
          />
        </svg>
      </div>

      <!-- Edad -->
      <div class="relative">
        <input
          type="number"
          formControlName="age"
          placeholder="Edad"
          class="input-animated w-full pl-10 p-2 border border-primary rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-primary
                 text-secondary placeholder-secondary"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 absolute left-3 top-2.5 text-secondary"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
      </div>

    <!-- Tipo de usuario (dropdown personalizado) -->
    <div class="relative dropdown-wrapper" tabindex="0">
      <!-- Input simulado -->
      <div
        (click)="isDropdownOpen = !isDropdownOpen"
        class="input-animated flex items-center justify-between w-full p-2 pl-10 pr-10 
              bg-white border border-gray-300 rounded-lg 
              text-secondary placeholder-secondary
              focus:outline-none focus:ring-2 focus:ring-primary 
              cursor-pointer transition"
      >
        <span
          [ngClass]="{
            'text-secondary': selectedType
          }"
        >
          {{ selectedType ? (selectedType === 'player' ? 'Jugador' : 'Entrenador') : 'Selecciona tipo de usuario' }}
        </span>

        <!-- Flecha animada -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          [ngClass]="{
            'rotate-180 scale-110': isDropdownOpen,
            'rotate-0 scale-100 text-secondary': !isDropdownOpen
          }"
          class="w-5 h-5 absolute right-3 top-2.5 transition-transform duration-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>

        <!-- Icono de tipo (izquierda, representativo de "rol") -->

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5 absolute left-3 top-2.5 text-secondary"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 2l7 4v6c0 5.25-3.75 10-7 10S5 17.25 5 12V6l7-4z" />
    </svg>

  </div>

  <!-- Dropdown -->
  <div
    *ngIf="isDropdownOpen"
    class="absolute z-10 w-full mt-1 bg-white border border-primary rounded-lg shadow-lg overflow-hidden animate-fadeIn"
  >
    <div
      (click)="selectType('player')"
      class="p-2 text-secondary hover:bg-primary hover:text-darkbg transition cursor-pointer"
    >
      Jugador
    </div>
    <div
      (click)="selectType('coach')"
      class="p-2 text-secondary hover:bg-primary hover:text-darkbg transition cursor-pointer"
    >
      Entrenador
    </div>
  </div>
</div>

 
      <!-- Correo electrónico -->
      <div class="relative">
        <input
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
          class=" input-animated w-full pl-10 p-2 border border-primary rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-primary
                 text-secondary placeholder-secondary"
        />
       <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 absolute left-3 top-2.5 text-secondary"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 8l9 6 9-6M21 8v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"
          />
        </svg>
      </div>

      <!-- Contraseña -->
      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Contraseña"
          class="input-animated w-full pl-10 pr-10 p-2 border border-primary rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-primary
                 text-secondary placeholder-secondary"
        />
        <svg
          class="w-5 h-5 absolute left-3 top-2.5 text-secondary fill-current"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M5 8a5 5 0 0110 0v2h1a1 1 0 011 1v7a1 1 0 01-1 1H4a1 1 0 01-1-1v-7a1 1 0 011-1h1V8zm2 0v2h6V8a3 3 0 00-6 0z"
            clip-rule="evenodd"
          />
        </svg>

        <!-- Botón mostrar/ocultar contraseña -->
        <button
          type="button"
          (click)="showPassword = !showPassword"
          class="absolute right-3 top-2.5 text-secondary hover:text-hover transition"
        >
          <!-- Icono ojo cerrado -->
          <svg
            *ngIf="!showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>

          <!-- Icono ojo abierto -->
          <svg
            *ngIf="showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a10.05 10.05 0 011.661-3.052m1.477-1.477A9.955 9.955 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.661 3.052M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>
      </div>



      <!-- Botón registro -->
      <button
        type="submit"
        class="w-full py-2 rounded-lg bg-primary text-darkbg font-bold hover:bg-hover transition"
      >
        Registrarse
      </button>

      <!-- Error -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </p>
    </form>

    <!-- Link login -->
    <p class="mt-4 text-center text-primary text-sm">
      ¿Ya tienes cuenta?
      <a
        routerLink="/login"
        class="font-medium hover:text-hover underline transition"
      >
        Inicia sesión
      </a>
    </p>
  </div>
</div>
