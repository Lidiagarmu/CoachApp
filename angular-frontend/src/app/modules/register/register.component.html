<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-lg">
  <h2 class="text-2xl font-bold mb-4 text-center">Register</h2>
  <form (ngSubmit)="register()" class="space-y-4">
    <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Full Name"
           class="w-full p-2 border border-gray-300 rounded" required />
    <input type="text" [(ngModel)]="nickname" name="nickname" placeholder="Nickname"
           class="w-full p-2 border border-gray-300 rounded" />
    <input type="number" [(ngModel)]="age" name="age" placeholder="Age"
           class="w-full p-2 border border-gray-300 rounded" />
    <input type="email" [(ngModel)]="email" name="email" placeholder="Email"
           class="w-full p-2 border border-gray-300 rounded" required />
    <input type="password" [(ngModel)]="password" name="password" placeholder="Password"
           class="w-full p-2 border border-gray-300 rounded" required />
    <select [(ngModel)]="type" name="type" class="w-full p-2 border border-gray-300 rounded">
      <option value="coach">Coach</option>
      <option value="player">Player</option>
    </select>
    <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
      Register
    </button>
  </form>
</div>
