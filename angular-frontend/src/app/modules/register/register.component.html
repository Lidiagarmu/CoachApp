<div class="max-w-md mx-auto mt-20 p-6 border rounded shadow-md bg-white">
  <h2 class="text-2xl font-bold mb-4">Registro</h2>

  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <label class="block mb-2 font-medium">Nombre completo</label>
    <input type="text" formControlName="fullName" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-medium">Email</label>
    <input type="email" formControlName="email" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-medium">Contraseña</label>
    <input type="password" formControlName="password" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-medium">Nickname</label>
    <input type="text" formControlName="nickname" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-medium">Edad</label>
    <input type="number" formControlName="age" class="w-full p-2 border rounded mb-4" />

    <label class="block mb-2 font-medium">Tipo</label>
    <select formControlName="type" class="w-full p-2 border rounded mb-4">
      <option value="player">Player</option>
      <option value="coach">Coach</option>
    </select>

    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
      Registrarse
    </button>

    <p *ngIf="errorMessage" class="text-red-500 mt-2">{{ errorMessage }}</p>
  </form>
</div>
