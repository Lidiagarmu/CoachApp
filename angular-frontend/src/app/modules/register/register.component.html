<app-navbar [showHome]="true" class="fixed top-0 left-0 w-full z-50"></app-navbar>

<main class="min-h-screen flex items-center justify-center bg-app-gradient pt-[4.5rem]">

    <!-- Back button-->
  <app-back-button class="absolute top-[5.5rem] right-4 z-40"></app-back-button>

  <div class="w-full h-[calc(100vh-4.5rem)] flex transition-all duration-500 ease-in-out">
    
    <!-- 🧑‍🏫 COACH SIDE -->
    <div
      class="relative w-1/2 flex flex-col items-center justify-center text-center transition-all duration-500 cursor-pointer"
      [ngClass]="{
        'w-[65%]': hovered === 'coach',
        'w-[35%]': hovered === 'player'
      }"
      (mouseenter)="hovered = 'coach'"
      (mouseleave)="hovered = null"
      (click)="goTo('coach')"
    >
      <div class="absolute inset-0 bg-darkbg/70 hover:bg-darkbg/80 transition"></div>
      <img src="images/coach.webp" class="absolute inset-0 object-cover w-full h-full rounded-none" />
      <div class="relative z-10 text-white">
        <h2 class="text-4xl font-bold mb-4">¿Eres entrenador?</h2>
        <p class="max-w-xs mx-auto mb-6 text-white">Crea tu perfil de entrenador, forma un equipo y gestiona tus entrenamientos fácilmente.</p>
        <button class="bg-primary text-darkbg px-6 py-2 rounded-lg font-semibold hover:bg-hover transition">Registrar como entrenador</button>
      </div>
    </div>

    <!-- ⚽ PLAYER SIDE -->
    <div
      class="relative w-1/2 flex flex-col items-center justify-center text-center transition-all duration-500 cursor-pointer"
      [ngClass]="{
        'w-[65%]': hovered === 'player',
        'w-[35%]': hovered === 'coach'
      }"
      (mouseenter)="hovered = 'player'"
      (mouseleave)="hovered = null"
      (click)="goTo('player')"
    >
      <div class="absolute inset-0 bg-darkbg/70 hover:bg-darkbg/80 transition"></div>
      <img src="images/player.webp" class="absolute inset-0 object-cover w-full h-full rounded-none" />
      <div class="relative z-10 text-white">
        <h2 class="text-4xl font-bold mb-4">¿Eres jugador?</h2>
        <p class="max-w-xs mx-auto mb-6 text-white">Crea tu perfil y únete a tu equipo para estar al tanto de todos los eventos.</p>
        <button class="bg-primary text-darkbg px-6 py-2 rounded-lg font-semibold hover:bg-hover transition">Registrar como jugador</button>
      </div>
    </div>

  </div>
</main>
