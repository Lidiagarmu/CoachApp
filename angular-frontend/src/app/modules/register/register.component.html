<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Registro</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-4">

      <!-- Nombre completo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
        <input
          type="text"
          formControlName="fullName"
          placeholder="Juan Pérez"
          class="w-full pl-3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <div class="relative">
          <input
            type="email"
            formControlName="email"
            placeholder="tucorreo@ejemplo.com"
            class="w-full pl-10 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
          <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H8m8 0l-4 4m0-8l4 4" />
          </svg>
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-10 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a10.05 10.05 0 011.661-3.052m1.477-1.477A9.955 9.955 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.661 3.052M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Nickname -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nickname</label>
        <input
          type="text"
          formControlName="nickname"
          placeholder="TuNick"
          class="w-full pl-3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
        />
      </div>

      <!-- Edad -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Edad</label>
        <input
          type="number"
          formControlName="age"
          placeholder="18"
          class="w-full pl-3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
        />
      </div>

      <!-- Tipo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
        <select
          formControlName="type"
          class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
        >
          <option value="player">Player</option>
          <option value="coach">Coach</option>
        </select>
      </div>

      <button type="submit"
        class="w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold hover:from-pink-500 hover:to-purple-500 transition">
        Registrarse
      </button>

      <p *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</p>
    </form>

    <p class="mt-4 text-center text-gray-600 text-sm">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-purple-600 font-medium hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
