<app-navbar class="fixed top-0 left-0 w-full z-50"></app-navbar>

<main class="relative min-h-[calc(100vh-8rem)] flex flex-col lg:flex-row items-center justify-center bg-app-gradient pt-[4.5rem] pb-[3.5rem] lg:gap-x-4">

  <app-back-button class="absolute top-[5.5rem] right-4 z-40"></app-back-button>

  <!-- Imagen lateral opcional en escritorio -->
  <div class="hidden lg:flex lg:w-1/2 items-center justify-end pr-4">
    <img src="images/register-player.png"
         alt="Registro Jugador"
         class="w-80 h-80 lg:w-96 lg:h-[500px] object-cover rounded-2xl shadow-xl shadow-black/70 animate-fade-in-left"/>
  </div>

  <!-- Formulario -->
  <div class="w-full lg:w-1/2 flex justify-center lg:justify-start px-2 sm:px-4">
    <div class="w-full max-w-2xl bg-darkbg rounded-2xl shadow-lg p-6 sm:p-8 lg:p-10">
      <h2 class="text-2xl sm:text-3xl font-bold text-center text-primary mb-6">Registro Jugador</h2>

      <form [formGroup]="registerForm" (ngSubmit)="register()" class="grid grid-cols-1 lg:grid-cols-2 gap-4">

        <!-- Nombre completo -->
        <input type="text" formControlName="fullName" placeholder="Nombre completo"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Apodo -->
        <input type="text" formControlName="nickname" placeholder="Apodo"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Edad -->
        <input type="number" formControlName="age" placeholder="Edad"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Posición -->
        <input type="text" formControlName="position" placeholder="Posición"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Número -->
        <input type="number" formControlName="number" placeholder="Número"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Equipo -->
        <select formControlName="teamId"
                class="w-full pl-3 p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary">
          <option value="">Selecciona tu equipo</option>
          <option *ngFor="let team of teams" [value]="team.id">{{ team.name }}</option>
        </select>

        <!-- Email -->
        <input type="email" formControlName="email" placeholder="Correo electrónico"
               class="input-animated w-full p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary" />

        <!-- Contraseña -->
        <div class="relative w-full">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Contraseña"
                 class="input-animated w-full pl-10 pr-10 p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary"/>
          <button type="button" (click)="showPassword = !showPassword"
                  class="absolute right-3 top-2.5 md:top-3 text-secondary hover:text-hover transition">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a10.05 10.05 0 011.661-3.052M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            </svg>
          </button>
        </div>

        <!-- Repetir contraseña -->
        <div class="relative w-full">
          <input [type]="showRepeatPassword ? 'text' : 'password'" formControlName="repeatPassword" placeholder="Repetir contraseña"
                 class="input-animated w-full pl-10 pr-10 p-2 border border-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-secondary placeholder-secondary"/>
          <button type="button" (click)="showRepeatPassword = !showRepeatPassword"
                  class="absolute right-3 top-2.5 md:top-3 text-secondary hover:text-hover transition">
            <svg *ngIf="!showRepeatPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a10.05 10.05 0 011.661-3.052M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="showRepeatPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            </svg>
          </button>
        </div>

        <!-- Barra de progreso de contraseña -->
        <div class="col-span-1 lg:col-span-2">
          <div class="w-full bg-secondary/30 rounded-full h-2 mt-1">
            <div [style.width.%]="passwordStrength" class="bg-primary h-2 rounded-full transition-all"></div>
          </div>
          <p class="text-sm text-secondary mt-1">Seguridad de la contraseña</p>
        </div>

        <!-- Botón de submit -->
        <button type="submit"
                class="col-span-1 lg:col-span-2 w-full py-2 md:py-3 rounded-lg bg-primary text-darkbg font-bold hover:bg-hover transition">
          Registrarse
        </button>

        <!-- Mensaje de error -->
        <p *ngIf="errorMessage" class="col-span-1 lg:col-span-2 text-red-500 text-sm text-center">{{ errorMessage }}</p>

      </form>
    </div>
  </div>
</main>
