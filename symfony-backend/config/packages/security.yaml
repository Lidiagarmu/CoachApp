security:
    enable_authenticator_manager: true

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 🔓 Firewalls para endpoints públicos (registro y login)
        public:
            pattern: ^/api/(login_check|register|team/available)
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            provider: app_user_provider

        # 🔐 Resto del API protegido con JWT
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~


    access_control:
        # Permitir preflight OPTIONS para cualquier ruta /api
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        
        # Endpoints públicos
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/team/available, roles: PUBLIC_ACCESS }

        # Endpoints protegidos por roles
        - { path: ^/api/player/available, roles: ROLE_COACH }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/coach, roles: ROLE_COACH }
        - { path: ^/api/player, roles: ROLE_PLAYER }

        # Regla general para todo lo demás
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
