nelmio_cors:
  defaults:
    allow_origin: ['http://localhost:4200']
    allow_credentials: true
    allow_headers: ['Content-Type', 'Authorization']
    expose_headers: ['Link']
    allow_methods: ['OPTIONS', 'GET', 'POST', 'PUT', 'PATCH', 'DELETE']
    max_age: 3600
  paths:
    '^/api/':
      allow_origin: ['http://localhost:4200']
      allow_headers: ['Content-Type', 'Authorization']
      expose_headers: ['Link']
      allow_methods: ['OPTIONS', 'GET', 'POST', 'PUT', 'PATCH', 'DELETE']
      allow_credentials: true
      max_age: 3600
